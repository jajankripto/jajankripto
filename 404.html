<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Halaman Tidak Ditemukan | Jajan Kripto</title>
  <meta name="description" content="Maaf, halaman yang Anda cari tidak dapat ditemukan.">
  
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #FF9900;
      --primary-light: #FFB347;
      --primary-dark: #CC7A00;
      --bg-light: #FFFFFF;
      --bg-subtle: #F8FAFC;
      --text-main: #1A1A1A;
      --text-muted: #64748B;
      --glass-border: rgba(0, 0, 0, 0.05);
      --shadow-glow: rgba(255, 153, 0, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-light);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* --- BACKGROUND DECORATION --- */
    .bg-dot-grid {
      position: fixed;
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%;
      background-image: radial-gradient(var(--glass-border) 1px, transparent 1px);
      background-size: 30px 30px;
      z-index: -1;
    }

    /* --- HEADER --- */
    .header {
      position: fixed;
      top: 20px; 
      left: 0; 
      width: 100%;
      z-index: 1000;
      display: flex;
      justify-content: center;
      padding: 0 20px;
    }

    .header-pill {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      padding: 10px 24px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 1100px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      font-weight: 800;
      font-size: 20px;
      color: var(--text-main);
    }

    .brand span { 
      color: var(--primary); 
    }

    /* --- 404 SECTION --- */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 120px 20px 60px;
      text-align: center;
    }

    .tag-pill {
      display: inline-flex;
      align-items: center;
      background: #FFF5E6;
      color: var(--primary-dark);
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 153, 0, 0.2);
    }

    .error-code {
      font-size: clamp(100px, 15vw, 180px);
      font-weight: 800;
      line-height: 1;
      margin-bottom: 10px;
    }

    .text-gradient {
      background: linear-gradient(135deg, var(--primary), #FF4D00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .error-title {
      font-size: clamp(24px, 5vw, 36px);
      font-weight: 800;
      margin-bottom: 16px;
    }

    .error-desc {
      color: var(--text-muted);
      font-size: clamp(16px, 2vw, 18px);
      max-width: 500px;
      margin: 0 auto 40px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      padding: 16px 32px;
      border-radius: 12px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 10px 25px var(--shadow-glow);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      background: var(--primary-dark);
      box-shadow: 0 15px 30px var(--shadow-glow);
    }

    .btn-secondary {
      background: white;
      color: var(--text-main);
      border: 1px solid var(--glass-border);
      margin-left: 12px;
    }

    .btn-secondary:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn-group {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* --- ANIMATIONS --- */
    @keyframes fadeUp {
      from { 
        opacity: 0; 
        transform: translateY(20px); 
      }
      to { 
        opacity: 1; 
        transform: translateY(0); 
      }
    }

    .fade-up { 
      animation: fadeUp 0.8s forwards; 
    }
    
    .d1 { animation-delay: 0.1s; }
    .d2 { animation-delay: 0.2s; }
    .d3 { animation-delay: 0.3s; }
    .d4 { animation-delay: 0.4s; }

  </style>
</head>
<body>

  <div class="bg-dot-grid"></div>

  <header class="header">
    <div class="header-pill">
      <a href="/" class="brand">
        <span>[</span> Jajan Kripto <span>]</span>
      </a>
      <a href="https://t.me/JajanKriptoOfficial_bot?start=buy" class="btn btn-primary" style="padding: 8px 20px; font-size: 14px; border-radius: 999px;">
        Coba Bot
      </a>
    </div>
  </header>

  <main>
    <span class="tag-pill fade-up d1">⚠️ Error 404</span>
    <h1 class="error-code text-gradient fade-up d2">404</h1>
    <h2 class="error-title fade-up d3">Waduh, Anda Tersesat!</h2>
    <p class="error-desc fade-up d3">
      Halaman yang Anda cari mungkin telah dipindahkan, diganti namanya, atau memang tidak pernah ada di ekosistem kami.
    </p>
    
    <div class="btn-group fade-up d4">
      <a href="index.html" class="btn btn-primary">
        ← Kembali ke Beranda
      </a>
      <a href="https://t.me/JajanKriptoOfficial_bot?start=help" class="btn btn-secondary">
        Pusat Bantuan
      </a>
    </div>
  </main>

</body>
</html>
