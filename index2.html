<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jajan Kripto - Beli Kripto via QRIS</title>
    <style>
        :root {
            --primary: #007bff;
            --background: #f4f7f6;
            --card-bg: #ffffff;
            --text-dark: #333333;
            --text-muted: #666666;
            --success: #28a745;
            --danger: #dc3545;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        /* Bagian QRIS yang disembunyikan di awal */
        #qris-section {
            display: none;
        }

        #qr-image {
            width: 250px;
            height: 250px;
            margin: 20px auto;
            border-radius: 8px;
            border: 2px solid #eee;
            padding: 10px;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            margin-top: 15px;
            background-color: #fff3cd;
            color: #856404;
        }

        .status-success { background-color: #d4edda; color: #155724; }
        .status-failed { background-color: #f8d7da; color: #721c24; }
        
        .tx-info {
            font-size: 14px;
            color: var(--text-muted);
            margin: 5px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🚀 Jajan Kripto</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 25px;">Beli koin instan, bayar pakai QRIS langsung masuk ke wallet.</p>

        <div id="order-section">
            <div class="form-group">
                <label for="coin">Pilih Koin</label>
                <select id="coin">
                    <option value="USDT">Tether (USDT)</option>
                    <option value="TRX">Tron (TRX)</option>
                    <option value="BNB">Binance Coin (BNB)</option>
                    <option value="SOL">Solana (SOL)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="network">Jaringan (Network)</label>
                <select id="network">
                    <option value="TRC20">TRC20 (Tron)</option>
                    <option value="BSC">BEP20 (BSC)</option>
                    <option value="SOL">Solana</option>
                </select>
            </div>

            <div class="form-group">
                <label for="amount_idr">Nominal Beli (Minimal Rp 20.000)</label>
                <input type="number" id="amount_idr" placeholder="Contoh: 50000" min="20000">
            </div>

            <div class="form-group">
                <label for="address">Alamat Wallet Tujuan</label>
                <input type="text" id="address" placeholder="Tempel alamat wallet di sini...">
            </div>

            <button id="btn-submit" onclick="buatPesanan()">Beli Sekarang</button>
        </div>

        <div id="qris-section">
            <h3>💳 Silakan Scan QRIS</h3>
            <p class="tx-info">Order ID: <b id="display-order-id">-</b></p>
            <p class="tx-info">Total Bayar: <b id="display-total-bayar" style="color: var(--primary); font-size: 18px;">-</b></p>
            <p class="tx-info">Kripto Diterima: <b id="display-amount-crypto">-</b></p>

            <img id="qr-image" src="" alt="Loading QRIS...">

            <div>
                <div id="status-text" class="status-badge">🔄 Menunggu Pembayaran...</div>
            </div>
            
            <p id="tx-hash-info" style="display: none; font-size: 12px; margin-top: 15px; word-break: break-all;">
                <b>TX Hash (Bukti):</b> <br><span id="tx-hash-value"></span>
            </p>
        </div>
    </div>

    <script>

        const API_BASE_URL = "http://37.148.199.196:8000/api"; 
        
        let intervalPengecekan;

        async function buatPesanan() {
            // 1. Ambil data dari inputan form
            const coin = document.getElementById('coin').value;
            const network = document.getElementById('network').value;
            const amount_idr = parseInt(document.getElementById('amount_idr').value);
            const address = document.getElementById('address').value;
            const btnSubmit = document.getElementById('btn-submit');

            // 2. Validasi sederhana di browser
            if (!amount_idr || amount_idr < 20000) {
                alert("Nominal beli minimal Rp 20.000");
                return;
            }
            if (!address) {
                alert("Alamat wallet tidak boleh kosong!");
                return;
            }

            // 3. Ubah tombol jadi loading
            btnSubmit.innerText = "⏳ Sedang memproses...";
            btnSubmit.disabled = true;

            try {
                // 4. Kirim request HTTP POST ke backend Python kamu
                const response = await fetch(`${API_BASE_URL}/create-order`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        coin: coin,
                        network: network,
                        amount_idr: amount_idr,
                        address: address
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Gagal membuat pesanan");
                }

                // 5. Jika sukses, sembunyikan form dan munculkan QRIS
                document.getElementById('order-section').style.display = 'none';
                document.getElementById('qris-section').style.display = 'block';
                
                // Isi data QRIS ke layar
                document.getElementById('qr-image').src = data.qr_url;
                document.getElementById('display-order-id').innerText = data.txn_id;
                document.getElementById('display-total-bayar').innerText = "Rp " + data.total_bayar.toLocaleString('id-ID');
                document.getElementById('display-amount-crypto').innerText = `${data.amount_kripto} ${coin}`;

                // 6. Mulai siklus pengecekan status otomatis
                mulaiCekStatus(data.txn_id);

            } catch (error) {
                alert("Error: " + error.message);
                btnSubmit.innerText = "Beli Sekarang";
                btnSubmit.disabled = false;
            }
        }

        function mulaiCekStatus(txn_id) {
            const statusText = document.getElementById('status-text');

            // Cek ke API setiap 3 detik
            intervalPengecekan = setInterval(async () => {
                try {
                    const res = await fetch(`${API_BASE_URL}/order-status/${txn_id}`);
                    const data = await res.json();

                    if (data.status === "PROCESSING") {
                        statusText.innerText = "⏳ Pembayaran Masuk! Sedang mengirim koin...";
                    } 
                    else if (data.status === "SUCCESS") {
                        clearInterval(intervalPengecekan); // Hentikan pengecekan
                        statusText.className = "status-badge status-success";
                        statusText.innerText = "✅ Selesai! Koin sudah dikirim.";
                        document.getElementById('qr-image').style.opacity = "0.2"; // Redupkan QRIS
                        
                        // Munculkan TX Hash (Bukti pengiriman blockchain)
                        if(data.tx_hash) {
                            document.getElementById('tx-hash-info').style.display = 'block';
                            document.getElementById('tx-hash-value').innerText = data.tx_hash;
                        }
                    } 
                    else if (data.status === "FAILED" || data.status === "EXPIRED") {
                        clearInterval(intervalPengecekan);
                        statusText.className = "status-badge status-failed";
                        statusText.innerText = `❌ Transaksi ${data.status}`;
                    }

                } catch (error) {
                    console.error("Gagal mengecek status:", error);
                }
            }, 3000); // 3000 milidetik = 3 detik
        }
    </script>
</body>
</html>
